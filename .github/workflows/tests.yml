name: Test HAMMS
on:
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=2 --retries=0
      - run: npx --yes firebase-tools@15.10.1 emulators:exec --only firestore --project demo-hamms-tests "node --test tests/rules/firestore.test.mjs"
